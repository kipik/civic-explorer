<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Civic Explorer — Console locale d'observations L17</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#analyst-main">Aller au contenu principal</a>

    <header class="site-header">

        <div class="brand">

          <span class="badge badge-obs">Console locale hors ligne</span>
          <span class="badge">Zéro serveur · Export CSV / JSON</span>

        <div class="header-actions">
          <button id="analyst-clear-btn" type="button" class="btn btn-subtle btn-danger">
            Tout effacer de la mémoire
          </button>
        </div>
      </div>
    </header>

    <main id="analyst-main" class="container container-wide"></main>

    <script src="./js/data.js" defer></script>
    <script src="./js/maxdiff.js" defer></script>
    <script src="./js/export-l17.js" defer></script>
    <script src="./js/analyst-app.js" defer></script>
